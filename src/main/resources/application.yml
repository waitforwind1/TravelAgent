spring:
  application:
    name: SuperAI
  #  ??????????local??local???????
  profiles:
    active: local
server:
  servlet:
    context-path: "/api"

# springdoc-openapi????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.usst.superai.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
app:
  filedir: ./tmp/files
  downloadPrefix: http://localhost:8080/api/travel/plan/download/
  cors:
    allowed-origins:
      - http://localhost:5173
    
