spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:spring_ai_chat_memory}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus

    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat

    zhipuai:
      api-key: ${ZHIPUAI_API_KEY}
      chat:
        options:
          model: glm-4.7

    mcp:
      client:
        enabled: false

app:
  filedir: ${APP_FILE_DIR:/opt/superai/tmp/files}
  downloadPrefix: ${APP_DOWNLOAD_PREFIX:https://你的域名/api/travel/plan/download/}
  cors:
    allowed-origins:
      - ${APP_FRONTEND_ORIGIN:https://你的前端域名}